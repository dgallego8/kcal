<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kcal · Contador de calorías</title>
  <meta name="description" content="Cuenta calorías con foto, texto o búsqueda y cuida a tu chigüiro.">
  <meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kcal">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <main id="view" class="view"></main>
    <nav class="tabbar" aria-label="Secciones">
      <button class="tab active" data-tab="hoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.6H9.2v5.6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
        <span>Hoy</span>
      </button>
      <button class="tab" data-tab="progreso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5 9 12l4-3.5 7.5 8"/><path d="M15.5 16.5h5v-5"/></svg>
        <span>Progreso</span>
      </button>
      <button id="fab" class="fab" aria-label="Agregar comida">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="chigui">
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="5.8" cy="10.2" rx="2.1" ry="2.6"/><ellipse cx="9.8" cy="6.2" rx="2.1" ry="2.7"/><ellipse cx="14.4" cy="6.2" rx="2.1" ry="2.7"/><ellipse cx="18.4" cy="10.2" rx="2.1" ry="2.6"/><path d="M12.1 11.6c-3 0-6 3.7-6 6.2 0 1.8 1.5 2.6 3 2.3 1.2-.2 2-.8 3-.8s1.8.6 3 .8c1.5.3 3-.5 3-2.3 0-2.5-3-6.2-6-6.2z"/></svg>
        <span>Chigüi</span>
      </button>
      <button class="tab" data-tab="ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17.4 7H20M4 17h2.6M11.4 17H20"/><circle cx="15.2" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Kcal necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
